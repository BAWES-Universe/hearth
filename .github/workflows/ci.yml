# CI for BAWES-Universe/hearth — Go server + Go media (Pion SFU) + TS client.
# Runs on push to main and on every PR. TDD gate: vet + tests must pass;
# server coverage is computed and reported (PR comment + job summary).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Go server (module `hearth`, go.mod 1.22) ---
  server:
    name: server (Go) · vet + test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single toolchain that satisfies both go.mod directives
          # (server 1.22, media 1.24.0).
          go-version: '1.26.x'
          cache-dependency-path: |
            server/go.sum
            media/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload server coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.out
          if-no-files-found: error

  # --- Go media package (module hearth/media, go.mod 1.24) ---
  media:
    name: media (Go) · vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: media
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: media/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # --- TS client (Vite + PixiJS + Preact PWA) ---
  client:
    name: client (TS) · build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: npm ci
        run: npm ci

      - name: build (tsc --noEmit + vite build + PWA)
        run: npm run build

      - name: test (vitest — protocol/envelope contract)
        run: npm test

  # --- Coverage report: server/ go test coverage %, reported on PRs ---
  coverage:
    name: coverage · report server %
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: server
    permissions:
      contents: read
      pull-requests: write # post/update the coverage comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: coverage

      - name: Compute server coverage
        id: cover
        run: |
          # cover profile paths are module-relative ("hearth/*.go"), so resolve
          # from server/ (the module root).
          total=$(cd server && go tool cover -func=../coverage/coverage.out | tail -1 | awk '{print $NF}')
          echo "coverage_pct=$total" >> "$GITHUB_OUTPUT"
          {
            echo "## Server test coverage"
            echo ""
            echo "**${total}** of statements covered (Go \`server/\`)."
            echo ""
            echo "> Threshold gate not enforced yet — CI reports only. Set a floor"
            echo "> (e.g. fail below 30%) in this job once day-0 coverage is stable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_PCT: ${{ steps.cover.outputs.coverage_pct }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- hearth-ci-coverage -->';
            const body =
              marker +
              `\n### Server test coverage\n\n**${process.env.COVERAGE_PCT}** of statements covered in \`server/\`.\n\n` +
              `_Auto-reported by CI. Coverage threshold gate not yet enforced._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
